name: tauri-build

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 启用 pnpm 并安装前端依赖（锁定安装）
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 前端 lint
        run: pnpm ng lint

      - name: 安装 Rust 工具链（与 rust-toolchain.toml 一致）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 缓存 OCR 模型与运行时（约 200MB，清单或脚本变更时失效）
        uses: actions/cache@v4
        with:
          path: |
            app/src-tauri/resources/ocr-models/files
            app/src-tauri/resources/onnxruntime
            app/src-tauri/resources/pdfium
          key: ocr-resources-${{ hashFiles('app/src-tauri/resources/ocr-models/models.toml', 'app/scripts/download-models.mjs', 'app/scripts/download-runtimes.mjs') }}

      - name: 下载并校验 OCR 模型（models.toml）
        run: node scripts/download-models.mjs

      - name: 下载并校验 OCR 运行时库（ONNX Runtime / pdfium）
        run: node scripts/download-runtimes.mjs

      - name: Rust 格式与静态检查
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 构建 Tauri 应用
        run: pnpm tauri build

      - name: 上传 macOS 产物
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: querydoc-macos-arm64
          path: app/src-tauri/target/release/bundle/

      - name: 上传 Windows 产物
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: querydoc-windows-x64
          path: app/src-tauri/target/release/bundle/

      - name: 发布到 GitHub Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
