<header class="header">
  <div class="branding">
    <a routerLink="/" class="nav-link brand-link">
      <span class="title">QueryDoc</span>
    </a>
  </div>
  <nav class="header-nav">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      <span class="nav-text">项目</span>
    </a>
  </nav>
  <div class="header-actions">
    <button
      type="button"
      class="btn btn-link settings-btn"
      (click)="settingsOpen.set(true)"
    >
      <cds-icon shape="cog"></cds-icon>
      设置
    </button>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<app-settings-modal [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
